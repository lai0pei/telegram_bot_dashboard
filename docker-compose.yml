services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=tgdash
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=tgdash
    volumes:
      - tgdash-pg:/var/lib/postgresql/data
    # Local development only: lets `npm run dev` / `npm run db:migrate` reach the database. Not reachable from the network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgdash -d tgdash"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: telegram-bot-dashboard:latest
    env_file: .env
    environment:
      - DATABASE_URL=postgres://tgdash:${POSTGRES_PASSWORD}@db:5432/tgdash
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_BIND:-127.0.0.1}:3000:3000"
    # Docker's default json-file driver keeps container output forever; rotate it so a noisy error can't fill the disk.
    # Errors are also stored in the database (Admin > Errors), so this is only the raw fallback.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

volumes:
  tgdash-pg:
